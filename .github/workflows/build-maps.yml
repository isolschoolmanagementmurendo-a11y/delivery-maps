name: Process Geofabrik Map

on:
  workflow_dispatch:
    inputs:
      country_path:
        description: 'Geofabrik path (e.g. africa/zimbabwe-latest.osm.pbf)'
        required: true
        default: 'africa/zimbabwe-latest.osm.pbf'
      country_code:
        description: 'Country identifier (e.g. zimbabwe)'
        required: true
        default: 'zimbabwe'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Osmium Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Download clean extract from Geofabrik
        run: |
          echo "Downloading from Geofabrik..."
          curl -L -f -A "Mozilla/5.0" \
            -o raw.osm.pbf \
            "https://download.geofabrik.de/${{ github.event.inputs.country_path }}"
          ls -lh raw.osm.pbf

      - name: Filter Roads for Routing
        run: |
          osmium tags-filter raw.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service \
            -o "${{ github.event.inputs.country_code }}-roads.osm.pbf" \
            --overwrite
          ls -lh "${{ github.event.inputs.country_code }}-roads.osm.pbf"

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Processed Road Maps"
          files: "${{ github.event.inputs.country_code }}-roads.osm.pbf"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
