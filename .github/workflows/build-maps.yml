name: Filter Raw OSM Map to Roads

on:
  workflow_dispatch:
    inputs:
      raw_file_url:
        description: 'Direct download URL from your GitHub Release'
        required: true
      country_code:
        description: 'Output country prefix (e.g. zimbabwe)'
        required: true
        default: 'zimbabwe'

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Download Raw File from Release
        run: |
          echo "Downloading from ${{ github.event.inputs.raw_file_url }}..."
          curl -L -o raw.osm.pbf "${{ github.event.inputs.raw_file_url }}"
          ls -lh raw.osm.pbf

      - name: Filter Roads for Routing
        run: |
          echo "Filtering out non-road layers..."
          osmium tags-filter raw.osm.pbf \
            w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,service,living_street \
            -o ${{ github.event.inputs.country_code }}-roads.osm.pbf --overwrite
          
          echo "Cleaned file size:"
          ls -lh ${{ github.event.inputs.country_code }}-roads.osm.pbf

      - name: Upload Processed File to a New Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "processed-${{ github.event.inputs.country_code }}"
          name: "Clean Routing Data - ${{ github.event.inputs.country_code }}"
          files: "${{ github.event.inputs.country_code }}-roads.osm.pbf"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
