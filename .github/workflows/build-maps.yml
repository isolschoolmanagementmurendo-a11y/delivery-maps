name: Compile Mobile Route Files

on:
  workflow_dispatch:

jobs:
  build-routing-tiles:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install Valhalla Software Cleanly
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:valhalla-routing/valhalla
          sudo apt-get update
          sudo apt-get install -y valhalla-bin

      - name: Download Raw Zimbabwe Street Data
        run: |
          curl -LO https://geofabrik.de

      - name: Compile and Filter (Keep Only Road Graph Network)
        run: |
          mkdir -p valhalla_tiles
          valhalla_build_config --mjolnir-tile-dir=${PWD}/valhalla_tiles --mjolnir-tile-extract=${PWD}/zimbabwe_routes.tar.gz > valhalla.json
          valhalla_build_tiles -c valhalla.json zimbabwe-latest.osm.pbf

      - name: Create GitHub Release and Upload Map Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Release v1.0.0 (Automated Maps)
          files: zimbabwe_routes.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
