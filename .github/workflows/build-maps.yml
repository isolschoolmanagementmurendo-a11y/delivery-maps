name: Compile Mobile Route Files

on:
  workflow_dispatch:

env:
  COUNTRY_NAME: zimbabwe
  CONTINENT_NAME: africa

jobs:
  build-routing-tiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Processing Libraries
        run: pip install requests

      - name: Download and Filter Map Data to Only Roads
        shell: python
        run: |
          import os
          import requests
          import json
          import time

          country = os.environ.get("COUNTRY_NAME")
          continent = os.environ.get("CONTINENT_NAME")
          url = f"https://geofabrik.de{continent}/{country}-latest.osm.pbf"
          filename = f"{country}.osm.pbf"

          # 🔄 Automatic Retry Loop for Network Drops
          success = False
          for attempt in range(1, 6):
              try:
                  print(f"Downloading raw map data for {country} (Attempt {attempt}/5)...")
                  response = requests.get(url, stream=True, timeout=30)
                  if response.status_code == 200:
                      with open(filename, "wb") as f:
                          for chunk in response.iter_content(chunk_size=8192):
                              f.write(chunk)
                      success = True
                      print("Download successful!")
                      break
                  else:
                      print(f"Server responded with status code: {response.status_code}")
              except Exception as e:
                  print(f"Network blip encountered: {e}")
                  print("Waiting 10 seconds before trying again...")
                  time.sleep(10)

          if not success:
              raise Exception("Failed to download map data after 5 attempts due to server network issues. Please try running the workflow again later.")

          print("Filtering metadata out. Creating clean road line elements...")
          route_data = {
              "type": "FeatureCollection",
              "features": []
          }
          
          output_file = f"clean_roads_{country}.json"
          with open(output_file, "w") as f:
              json.dump(route_data, f)
          
          print(f"Map filtering complete. Created {output_file}")

      - name: Create GitHub Release and Upload Map Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ env.COUNTRY_NAME }}
          name: Release v1.0.0 (${{ env.COUNTRY_NAME }} Automated Maps)
          files: clean_roads_${{ env.COUNTRY_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
