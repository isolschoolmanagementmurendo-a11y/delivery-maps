name: Compile Mobile Route Files

on:
  workflow_dispatch:

env:
  COUNTRY_NAME: zimbabwe
  CONTINENT_NAME: africa

jobs:
  build-routing-tiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build Maps Using Valhalla Docker Container
        run: |
          # 1. Create the working folders that Docker requires
          mkdir -p custom_files
          chmod 777 custom_files

          # 2. Run the Docker container passing configuration through Environment Flags
          docker run --rm \
            -v ${{ github.workspace }}/custom_files:/custom_files \
            -e build_tiles=True \
            -e tile_urls="https://geofabrik.de{{ env.CONTINENT_NAME }}/${{ env.COUNTRY_NAME }}-latest.osm.pbf" \
            ghcr.io/gis-ops/docker-valhalla/valhalla:latest

          # 3. Compress the completed routing tiles directly out of the folder
          tar -czf delivery_routes.tar.gz -C custom_files/valhalla_tiles .

      - name: Create GitHub Release and Upload Map Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Release v1.0.0 (Automated Maps)
          files: delivery_routes.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
