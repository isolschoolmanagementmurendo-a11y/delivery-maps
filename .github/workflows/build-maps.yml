name: Build Road Map Packages
on:
  workflow_dispatch:

jobs:
  build-zimbabwe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Osmium C++)
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Download Raw Zimbabwe Data
        run: |
          echo "Downloading Zimbabwe data..."
          curl -L -o zimbabwe-latest.osm.pbf https://geofabrik.de

      - name: Stream Filter Roads (Zero RAM Crash Risk)
        run: |
          echo "Filtering roads only..."
          osmium tags-filter zimbabwe-latest.osm.pbf w/highway -o zimbabwe-roads.osm.pbf --overwrite

      - name: Run Python Packaging Script
        run: |
          python package_maps.py

      - name: Upload Processed Map Asset
        uses: actions/upload-artifact@v4
        with:
          name: zimbabwe-road-package
          path: |
            zimbabwe-roads.tar.gz
            maps.json
