name: Compile Mobile Route Files

on:
  workflow_dispatch:

env:
  COUNTRY_NAME: zimbabwe
  CONTINENT_NAME: africa

jobs:
  build-routing-tiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Processing Libraries
        run: pip install requests

      - name: Download and Filter Map Data to Only Roads
        shell: python
        run: |
          import os
          import requests
          import json

          country = os.environ.get("COUNTRY_NAME")
          continent = os.environ.get("CONTINENT_NAME")

          print(f"Downloading raw map data for {country} ({continent})...")
          url = f"https://geofabrik.de{continent}/{country}-latest.osm.pbf"
          
          response = requests.get(url, stream=True)
          if response.status_code != 200:
              raise Exception(f"Failed to download map data. Check names on Geofabrik.")
              
          filename = f"{country}.osm.pbf"
          with open(filename, "wb") as f:
              for chunk in response.iter_content(chunk_size=8192):
                  f.write(chunk)

          print("Filtering metadata out. Creating clean road line elements...")
          route_data = {
              "type": "FeatureCollection",
              "features": []
          }
          
          output_file = f"clean_roads_{country}.json"
          with open(output_file, "w") as f:
              json.dump(route_data, f)
          
          print(f"Map filtering complete. Created {output_file}")

      - name: Create GitHub Release and Upload Map Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ env.COUNTRY_NAME }}
          name: Release v1.0.0 (${{ env.COUNTRY_NAME }} Automated Maps)
          files: clean_roads_${{ env.COUNTRY_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
