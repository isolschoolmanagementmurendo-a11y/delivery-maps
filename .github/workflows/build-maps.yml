name: Compile Mobile Route Files

on:
  workflow_dispatch:

# 🌍 FUTURE PROOFING: To change countries, just modify these two lines!
env:
  COUNTRY_NAME: zimbabwe
  CONTINENT_NAME: africa

jobs:
  build-routing-tiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build Maps Using Valhalla Docker Container
        run: |
          # 1. Create a local folder to store the output tiles
          mkdir -p custom_tiles
          
          # 2. Run the processing engine inside a stable Docker container
          docker run --rm \
            -v ${{ github.workspace }}/custom_tiles:/custom_tiles \
            ghcr.io/gis-ops/docker-valhalla/valhalla:latest \
            build-tiles \
            --download-urls https://geofabrik.de{{ env.CONTINENT_NAME }}/${{ env.COUNTRY_NAME }}-latest.osm.pbf

          # 3. Compress the folder into a single clean file for your app
          tar -czf delivery_routes.tar.gz -C custom_tiles .

      - name: Create GitHub Release and Upload Map Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Release v1.0.0 (Automated Maps)
          files: delivery_routes.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
