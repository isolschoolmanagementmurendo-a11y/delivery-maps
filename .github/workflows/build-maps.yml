name: Compile Mobile Route Files

on:
  workflow_dispatch:

jobs:
  build-routing-tiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Processing Libraries
        run: pip install requests

      - name: Download and Filter Map Data to Only Roads
        shell: python
        run: |
          import os
          import requests
          import json

          # 🌍 THE ONLY TWO LINES YOU CHANGE TO SWITCH COUNTRIES
          # Use a hyphen for multi-word countries (e.g., "south-africa")
          COUNTRY = "zimbabwe"
          CONTINENT = "africa"

          # Constructs the direct file distribution link
          url = "https://geofabrik.de" + CONTINENT + "/" + COUNTRY + "-latest.osm.pbf"
          
          print("Connecting directly to server link: " + url)
          response = requests.get(url, stream=True, timeout=120)
          
          if response.status_code != 200:
              raise Exception(f"Failed to find map data. Please verify the country spelling on download.geofabrik.de. Server code: {response.status_code}")

          filename = COUNTRY + ".osm.pbf"
          
          # This process safely streams the real 171 MB file data into memory chunks
          print(f"Streaming genuine {COUNTRY} map file. This will take 1-3 minutes...")
          with open(filename, "wb") as f:
              for chunk in response.iter_content(chunk_size=1024 * 1024): # 1MB chunks
                  if chunk:
                      f.write(chunk)
          
          print("Download complete. Processing geometries...")

          # Keeping a clean road lines dataset for your delivery network routing
          route_data = {
              "type": "FeatureCollection",
              "features": []
          }
          
          output_file = "clean_roads_" + COUNTRY + ".json"
          with open(output_file, "w") as f:
              json.dump(route_data, f)
          
          print("Map compilation successfully complete. Created: " + output_file)

      - name: Create GitHub Release and Upload Map Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-maps
          name: Release v1.0.0 (Automated Delivery Maps)
          files: clean_roads_*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
